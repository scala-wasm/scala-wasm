name: CI

on:
  push:
    branches:
      - main
      - scala-wasm
      - '*-wasm.[0-9]*'
  pull_request:
    branches:
      - main
      - scala-wasm

env:
  SBT_OPTS: '-Xmx6g -Xms1g -Xss4m'

jobs:
  test-suite-js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [2_13]
        esVersion: [ES5_1, ES2015, ES2021]
    env:
      SBT_SET_COMMAND: 'set Seq(ThisBuild/scalaJSLinkerConfig ~= (_.withESFeatures(_.withESVersion(ESVersion.${{ matrix.esVersion }}))))'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: npm install
        run: npm install
      - name: helloworld${{ matrix.suffix }}/run
        run: sbt "$SBT_SET_COMMAND" "helloworld${{ matrix.suffix }}/run"
      - name: testSuite${{ matrix.suffix }}/test
        run: sbt "$SBT_SET_COMMAND" "testSuite${{ matrix.suffix }}/test"
      - name: testSuiteEx${{ matrix.suffix }}/test
        run: sbt "$SBT_SET_COMMAND" "testSuiteEx${{ matrix.suffix }}/test"

  test-suite-webassembly:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [2_12, 2_13]
        esVersion: [ES2022] # Minimum version for Wasm.
        jspi: [false, true]
    env:
      SBT_SET_COMMAND: 'set Seq(Global/enableWasmEverywhere := true, ThisBuild/scalaJSLinkerConfig ~= (_.withESFeatures(_.withESVersion(ESVersion.${{ matrix.esVersion }})).withWasmFeatures(_.withUseJSPI(${{ matrix.jspi }}))))'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: npm install
        run: npm install
      - name: helloworld${{ matrix.suffix }}/run
        run: sbt "$SBT_SET_COMMAND" "helloworld${{ matrix.suffix }}/run"
      - name: testSuite${{ matrix.suffix }}/test
        run: sbt "$SBT_SET_COMMAND" "testSuite${{ matrix.suffix }}/test"
      - name: testSuiteEx${{ matrix.suffix }}/test
        run: sbt "$SBT_SET_COMMAND" "testSuiteEx${{ matrix.suffix }}/test"

  test-suite-pure-wasm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [2_12, 2_13]
        esVersion: [ES2022] # Minimum version for Wasm.
        eh-support: [true, false]
    env:
      SBT_SET_COMMAND: 'set Seq(Global/enableWasmEverywhere := true, ThisBuild/scalaJSLinkerConfig ~= (_.withESFeatures(_.withESVersion(ESVersion.${{ matrix.esVersion }})).withModuleKind(ModuleKind.MinimalWasmModule).withWasmFeatures(_.withExceptionHandling(${{ matrix.eh-support }}).withUseJSPI(false))))'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: npm install
        run: npm install
      - name: helloworld-wasm${{ matrix.suffix }}/run
        run: sbt "$SBT_SET_COMMAND" "helloworldWasm${{ matrix.suffix }}/run"
      - name: helloworld-wasm${{ matrix.suffix }}/fullLinkJS
        run: sbt "$SBT_SET_COMMAND" "helloworldWasm${{ matrix.suffix }}/fullLinkJS"
      - name: helloworld-wasm${{ matrix.suffix }}/test
        run: sbt "$SBT_SET_COMMAND" "helloworldWasm${{ matrix.suffix }}/test"
      - name: testSuite${{ matrix.suffix }}/test
        run: sbt "$SBT_SET_COMMAND" "testSuite${{ matrix.suffix }}/test"

  test-suite-component:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [2_12, 2_13]
        include:
          - suffix: 2_12
            scalaVersion: "2.12"
          - suffix: 2_13
            scalaVersion: "2.13"
    env:
      SBT_SET_COMMAND: 'set Seq(Global/enableWasmEverywhere := true, ThisBuild/scalaJSLinkerConfig ~= (_.withESFeatures(_.withESVersion(ESVersion.ES2022)).withModuleKind(ModuleKind.WasmComponent).withWasmFeatures(_.withUseJSPI(false))))'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: npm install
        run: npm install
      - name: Install wasm32-wasip2
        run: rustup target add wasm32-wasip2
      - name: Install wasmtime, wasm-tools, wac-cli, cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime@44.0.2,wasm-tools,wac-cli,cargo-component
      - name: helloworldWASI${{ matrix.suffix }}/run
        run: sbt "$SBT_SET_COMMAND" helloworldWASI${{ matrix.suffix }}/run
      - name: Build rust-exports
        run: cargo component build --target wasm32-wasip2 -r
        working-directory: examples/test-component-model/rust-exports
      - name: Build rust-run
        run: cargo component build --target wasm32-wasip2 -r
        working-directory: examples/test-component-model/rust-run
      - name: testSuite${{ matrix.suffix }}/test with WasmComponent
        run: sbt "$SBT_SET_COMMAND" testSuite${{ matrix.suffix }}/test
      - name: testComponentModel${{ matrix.suffix }}/fastLinkJS
        run: sbt "$SBT_SET_COMMAND" testComponentModel${{ matrix.suffix }}/fastLinkJS
      - name: testComponentModel${{ matrix.suffix }}/fullLinkJS
        run: sbt "$SBT_SET_COMMAND" testComponentModel${{ matrix.suffix }}/fullLinkJS
      - name: wasmSystemTest/test
        run: sbt "$SBT_SET_COMMAND" wasmSystemTest/test
      - name: Compose and run tests
        run: make run SCALA_VERSION=${{ matrix.scalaVersion }}
        working-directory: examples/test-component-model

      - name: testSuite${{ matrix.suffix }}/test with WasmComponent
        run: sbt "$SBT_SET_COMMAND" testSuite${{ matrix.suffix }}/test

  test-suite-jvm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [2_12, 2_13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: testSuiteJVM${{ matrix.suffix }}/test
        run: sbt "testSuiteJVM${{ matrix.suffix }}/test"
      - name: testSuiteExJVM${{ matrix.suffix }}/test
        run: sbt "testSuiteExJVM${{ matrix.suffix }}/test"

  ir-compiler-and-linker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [2_12, 2_13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: npm install
        run: npm install
      - name: ir${{ matrix.suffix }}/test
        run: sbt "ir${{ matrix.suffix }}/test"
      - name: compiler${{ matrix.suffix }}/test
        run: sbt "compiler${{ matrix.suffix }}/test"
      - name: linker${{ matrix.suffix }}/test
        run: sbt "linker${{ matrix.suffix }}/test"

  sbt-plugin-scripted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: npm install
        run: npm install
      - name: Install wasmtime, wasm-tools, and wac-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime@44.0.2,wasm-tools,wac-cli
      - name: sbtPlugin2_12/scripted
        run: sbt sbtPlugin2_12/scripted
      - name: sbtPlugin3/scripted
        run: sbt sbtPlugin3/scripted

  publish-snapshot:
    needs:
      - test-suite-js
      - test-suite-webassembly
      - test-suite-pure-wasm
      - test-suite-component
      - test-suite-jvm
      - ir-compiler-and-linker-tests
      - sbt-plugin-scripted
    if: >
      github.repository == 'scala-wasm/scala-wasm' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/scala-wasm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Set per-commit SNAPSHOT version
        env:
          GIT_SHA: ${{ github.sha }}
        run: ./scripts/set-snapshot-version.sh
      - name: Publish SNAPSHOT to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          echo "$PGP_SECRET" | base64 --decode | gpg --batch --import
          ./scripts/publish.sh -x
